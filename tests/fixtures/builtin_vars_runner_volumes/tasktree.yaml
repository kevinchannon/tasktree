runners:
  test-runner:
    type: containerised
    engine: docker
    dockerfile: docker/Dockerfile
    context: .
    volumes:
      - "{{ tt.project_root }}:/workspace"
      - "{{ tt.recipe_dir }}:/config"
    env_vars:
      PROJECT_PATH: "{{ tt.project_root }}"
      USER_NAME_VAR: "{{ tt.user_name }}"

tasks:
  docker-test:
    runner: test-runner
    cmd: echo "Testing builtin vars in docker"
