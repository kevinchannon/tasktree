name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Pre-pull Docker images for E2E tests
      if: runner.os == 'Linux'
      run: docker pull alpine:latest

    # Enables nix-command/flakes out of the box. Nix has no Windows support,
    # so the Windows leg skips the Nix E2E tests via their skipUnless guard.
    - name: Install Nix (for E2E Nix tests)
      if: runner.os != 'Windows'
      uses: DeterminateSystems/nix-installer-action@main

    - name: Run unit tests
      run: uv run pytest tests/unit/ --tb=short

    - name: Run integration tests
      run: uv run pytest tests/integration/ --tb=short

    - name: Run E2E Docker tests
      if: runner.os == 'Linux'
      run: uv run pytest tests/e2e/ --ignore=tests/e2e/test_nix_runner.py --tb=short

    # Separate step so a Nix evaluation failure is not lost in the general
    # E2E output; also the only E2E coverage on the macOS legs.
    - name: Run E2E Nix tests
      if: runner.os != 'Windows'
      run: uv run pytest tests/e2e/test_nix_runner.py --tb=short

    - name: Test CLI commands
      run: uv run tt --help

    - name: Test CLI list command
      run: uv run tt --list
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Check code can be imported
      run: uv run python -c "from tasktree import Executor, Recipe, Task; print('Import successful')"
