name: Validate pipx Installation

on:
  workflow_run:
    workflows: ["Release to PyPI"]
    types:
      - completed
  workflow_dispatch:  # Allow manual triggering

jobs:
  validate-installation:
    # Only run if the release workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Ubuntu
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for PyPI propagation
        if: github.event_name == 'workflow_run'
        run: |
          echo "Waiting 90 seconds for PyPI to propagate the new package..."
          sleep 90

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipx
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath

      - name: Install tasktree via pipx
        shell: bash
        env:
          RELEASED_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION="${RELEASED_TAG#v}"
          if [ -z "$VERSION" ]; then
            # Manual dispatch: no released tag to pin to, just install the latest
            python -m pipx install tasktree
            exit 0
          fi
          # The initial sleep usually covers PyPI propagation, but not always:
          # an unlucky CDN edge can still serve the previous release, which
          # pipx would silently install. Pin the released version and poll
          # until PyPI can actually serve it.
          for attempt in $(seq 1 30); do
            if python -m pipx install "tasktree==$VERSION" --pip-args=--no-cache-dir; then
              exit 0
            fi
            echo "tasktree $VERSION not installable yet (attempt $attempt/30), retrying in 10s..."
            sleep 10
          done
          echo "::error::tasktree $VERSION did not become installable on PyPI in time"
          exit 1

      - name: Get installed tt version
        working-directory: example
        run: tt --version

      - name: Test tt --list command
        if: runner.os != 'Windows'
        working-directory: example
        run: tt --list

      - name: Run test task
        if: runner.os != 'Windows'
        working-directory: example
        run: tt package

      - name: Run test task
        if: runner.os == 'Windows'
        working-directory: example
        run: tt windows-task

      - name: Verify installation
        run: echo "✓ tasktree successfully installed via pipx on ${{ matrix.platform }}"

  validate-centos:
    # Only run if the release workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for PyPI propagation
        if: github.event_name == 'workflow_run'
        run: |
          echo "Waiting 90 seconds for PyPI to propagate the new package..."
          sleep 90

      - name: Install dependencies
        run: |
          dnf install -y python python-pip
        shell: bash

      - name: Install Python 3.12
        run: dnf install -y python3.12
        shell: bash

      - name: Install pipx with Python 3.12
        run: |
          pip install pipx
          pipx ensurepath
        shell: bash

      - name: Install tasktree via pipx with Python 3.12
        env:
          RELEASED_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION="${RELEASED_TAG#v}"
          if [ -z "$VERSION" ]; then
            # Manual dispatch: no released tag to pin to, just install the latest
            pipx install --python python3.12 tasktree
            exit 0
          fi
          # The initial sleep usually covers PyPI propagation, but not always:
          # an unlucky CDN edge can still serve the previous release, which
          # pipx would silently install. Pin the released version and poll
          # until PyPI can actually serve it.
          for attempt in $(seq 1 30); do
            if pipx install --python python3.12 "tasktree==$VERSION" --pip-args=--no-cache-dir; then
              exit 0
            fi
            echo "tasktree $VERSION not installable yet (attempt $attempt/30), retrying in 10s..."
            sleep 10
          done
          echo "::error::tasktree $VERSION did not become installable on PyPI in time"
          exit 1
        shell: bash

      - name: Get installed tt version
        working-directory: example
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tt --version
        shell: bash

      - name: Test tt --list command
        working-directory: example
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tt --list
        shell: bash

      - name: Run test task
        working-directory: example
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tt package
        shell: bash

      - name: Verify installation
        run: |
          echo "✓ tasktree successfully installed via pipx on CentOS Stream 9"