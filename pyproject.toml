[project]
name = "tasktree"
version = "0.0.0.dev0+local"
description = "A task automation tool with incremental execution"
readme = "src/tasktree/README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "typer>=0.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "colorama>=0.4.6",
    "pathspec>=0.11.0",
    "platformdirs>=4.0.0",
    "pygls>=2.0.0",
    "lsprotocol>=2023.0.0",
    "tree-sitter>=0.21,<1.0",
    "tree-sitter-yaml>=0.6,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.2", "pytest-cov>=6.0.0", "black>=26.1.0", "ruff>=0.14.14", "jsonschema>=4.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
tt = "tasktree.cli:cli"
tt-lsp = "tasktree.lsp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasktree"]

# The recipe schema is authored at the repo root, because the READMEs point
# users' editors at its raw-GitHub URL and that must keep resolving. tasktree
# also validates recipes against it at runtime, so the wheel carries a copy
# inside the package (see recipe_schema.schema_candidates).
[tool.hatch.build.targets.wheel.force-include]
"schema/tasktree-schema.json" = "tasktree/schema/tasktree-schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["tests"]
