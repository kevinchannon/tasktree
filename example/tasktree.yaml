# yaml-language-server: $schema=../schema/tasktree-schema.json
interpreters:
  # Named interpreters, referenced from runners/tasks via { use: name } or by name.
  # The 'default' key names the interpreter used wherever one is needed but not
  # specified - it replaces the platform default (bash on Unix, cmd on Windows).
  default: bash-strict

  bash-strict:
    cmd: /bin/bash
    preamble: set -euo pipefail

  py:
    cmd: python3
    ext: .py

  windows-cmd:
    cmd: cmd.exe /c
    ext: .bat

runners:
  # A containerised runner: tasks with 'runner: alpine' run inside a container
  # built from the Dockerfile. The project is mounted at the container's
  # working directory, so task inputs/outputs behave as they do on the host.
  alpine:
    type: containerised
    engine: docker
    dockerfile: Dockerfile
    # Alpine has no bash, so this runner brings its own interpreter; a
    # runner's interpreter takes precedence over 'interpreters: default:'.
    interpreter: sh

variables:
  # Value from environment variable with fallback default
  log_level: { env: LOG_LEVEL, default: "info" }
  # Value from a shell command evaluated at runtime.
  build_number: { eval: "echo -n $(( $(cat build_num.txt) + 1 ))" }
  # Value read directly from a file
  project_name: { read: project-name.txt }

imports:
  - file: tasks/utils.yaml
    as: utils

tasks:
  build:
    desc: Build outputs for a given type and target architecture
    args:
      - build_type:
          choices: ["debug", "release"]
          default: "debug"
      - target:
          type: str
          choices:
            - "x86"
            - "x86_64"
            - "arm"
            - "ppc"
          default: "x86_64"
    outputs: [build/**]
    cmd: |
      echo "Building {{ var.project_name }} (build #{{ var.build_number }}) for {{ arg.target }}..."
      mkdir -p build
      echo "code and stuff" > build/output-{{ arg.build_type }}-{{ arg.target }}.txt

  package:
    desc: Create an archive from multiple build variants
    deps:
      - build: ["debug", "x86"]
      - build: ["release"]
      - build: { build_type: "release", target: "ppc" }
    outputs: [archive.tar.gz]
    cmd: |
      echo "making archive.tar.gz..."
      touch archive.tar.gz

  transform:
    desc: Transform source data (demonstrates named inputs/outputs and self-references)
    inputs:
      - source: source.txt  # Named input - reference with {{ self.inputs.source }}
    outputs:
      - result: processed/result.txt   # Named output - reference with {{ self.outputs.result }}
      - log: processed/transform.log   # Named output
    cmd: |
      mkdir -p processed
      echo "Processing {{ self.inputs.source }} [log_level={{ var.log_level }}]" > {{ self.outputs.log }}
      tr '[:lower:]' '[:upper:]' < {{ self.inputs.source }} > {{ self.outputs.result }}
      echo "Done" >> {{ self.outputs.log }}

  summarize:
    desc: Create a summary from transformed output (demonstrates dep.* template usage)
    deps: [transform]
    outputs: [processed/summary.txt]
    cmd: |
      {
        echo "=== Summary ==="
        echo "Result file: {{ dep.transform.outputs.result }}"
        echo "Characters: $(wc -c < {{ dep.transform.outputs.result }})"
      } > processed/summary.txt

  clean:
    desc: Remove all generated files
    cmd: |
      rm -rf build/ processed/ output/ archive.tar.gz reports/ logs/
      echo "Cleaned."

  windows-task:
    desc: A task that runs in cmd.exe
    interpreter: windows-cmd
    cmd: dir

  python-info:
    desc: Print the Python version (demonstrates a task-level interpreter)
    interpreter: py
    cmd: |
      import sys
      print(f"Python {sys.version.split()[0]}")

  container-info:
    desc: Show the container's OS (demonstrates a containerised runner)
    runner: alpine
    cmd: |
      echo "Running in:"
      cat /etc/os-release